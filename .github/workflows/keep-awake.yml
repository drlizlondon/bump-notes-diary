# Keeps the Supabase Free project awake. Free projects pause after a quiet week, which took
# BumpNotes' database offline on 21 Oct 2026. /api/health runs `SELECT 1` against the live
# database (src/lib/data-store/health.ts), so one call a day counts as activity.
# It never fails the run: the NightMode daemon already alerts on a 503. It only reports.
name: Keep the database awake

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/health
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 https://bumpnotes.co.uk/api/health || echo 000)
          echo "HTTP $code: $(cat body.json 2>/dev/null)"
          if [ "$code" != "200" ]; then
            echo "::warning::BumpNotes health returned $code. If the database is paused, restore it in Supabase (project zsmusjlipihurchkmbwk)."
          fi
