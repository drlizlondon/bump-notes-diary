# Temporary (2026-10-29): load the live site in a real browser (phone size),
# report console errors and failed requests, save screenshots. Public pages only.
name: Diagnose BumpNotes database
on:
  push:
    branches: [diag-db-2026-10-29]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for p in / /auth /signin; do curl -s -o /dev/null -w "curl $p %{http_code} %{time_total}s\n" "https://bumpnotes.co.uk$p"; done
          dig +short bumpnotes.co.uk; dig +short www.bumpnotes.co.uk
          curl -s -o /dev/null -w "www: %{http_code} -> %{redirect_url}\n" https://www.bumpnotes.co.uk/
      - run: |
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.cjs <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ ...devices['iPhone 13'] });
            for (const path of ['/', '/auth', '/signin']) {
              const p = await ctx.newPage();
              const errs = [];
              p.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text().slice(0, 300)); });
              p.on('pageerror', e => errs.push('pageerror: ' + String(e.message).slice(0, 300)));
              p.on('requestfailed', r => errs.push('failed: ' + r.url().slice(0, 150) + ' ' + (r.failure() || {}).errorText));
              p.on('response', r => { if (r.status() >= 400) errs.push('HTTP ' + r.status() + ' ' + r.url().slice(0, 150)); });
              let status = 'n/a';
              try { const res = await p.goto('https://bumpnotes.co.uk' + path, { waitUntil: 'networkidle', timeout: 30000 }); status = res && res.status(); }
              catch (e) { errs.push('goto: ' + e.message.slice(0, 200)); }
              await p.waitForTimeout(3000);
              const text = (await p.evaluate(() => document.body ? document.body.innerText : '')).replace(/\s+/g, ' ').slice(0, 300);
              await p.screenshot({ path: 'shot' + path.replace(/\//g, '_') + '.png', fullPage: false });
              console.log('== ' + path + ' status ' + status + '\nvisible text: ' + text + '\n' + (errs.join('\n') || 'no errors'));
            }
            await b.close();
          })();
          JS
          node t.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shot*.png
