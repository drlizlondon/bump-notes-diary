# Temporary (2026-10-29): time the GreatInternet sample PDF downloads. Public only.
name: Diagnose BumpNotes database
on:
  push:
    branches: [diag-db-2026-10-29]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s https://greatinternet.app/samples -o s.html
          grep -oE '<a[^>]*href="[^"]*\.pdf"[^>]*>' s.html | sort -u
          for f in greatinternet-big-picture-planner-sample-review.pdf greatinternet-mybishbash-photobooth-sample-review.pdf; do
            for i in 1 2; do curl -s -o out.pdf -w "$f try $i: HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" "https://greatinternet.app/samples/pdf/$f"; done
            head -c 8 out.pdf; echo
          done
