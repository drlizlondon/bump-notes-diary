# Temporary (2026-10-29): GreatInternet sample PDF downloads come out 0 KB.
# Public pages only. Delete this branch after.
name: Diagnose BumpNotes database
on:
  push:
    branches: [diag-db-2026-10-29]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s https://greatinternet.app/samples -o s.html -w "samples page %{http_code}\n"
          grep -oE 'href="[^"]*pdf[^"]*"' s.html | sort -u
          for p in /samples/planner/pdf /samples/photobooth/pdf; do
            curl -s -D h.txt -o out.pdf --max-time 90 -w "$p -> HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" "https://greatinternet.app$p"
            grep -iE "^(content-type|content-length|content-disposition|x-vercel-cache|x-vercel-error|cache-control|age):" h.txt
            head -c 200 out.pdf | tr -cd '[:print:]\n'; echo
          done
