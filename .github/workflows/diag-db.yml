# Temporary (2026-10-29): wait for the unpause deploy, then report what the live
# sign-up pages say. Public pages only. Delete this branch after.
name: Diagnose BumpNotes database
on:
  push:
    branches: [diag-db-2026-10-29]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          for i in $(seq 1 40); do
            curl -s https://bumpnotes.co.uk/auth -o auth.html
            if ! grep -q "paused while we move" auth.html; then echo "attempt $i: pause message gone"; break; fi
            echo "attempt $i: still paused"; sleep 15
          done
          for path in /auth /signin /request-access /api/health; do
            code=$(curl -s -o page.html -w '%{http_code}' "https://bumpnotes.co.uk$path")
            echo "== $path HTTP $code"
            grep -oiE "paused while we move|invite code|request access|have a code|create (an |your )?account|sign up|db\":\"[a-z]+" page.html | sort | uniq -c
          done
